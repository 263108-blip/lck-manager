<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lck-manager</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:grid;place-items:center;background:#0a0e15;color:#e8edf5;font:14px system-ui,sans-serif">LCK MANAGER 불러오는 중...</div>
    </div>
    <script>
      const showStartupError = (message) => {
        const root = document.getElementById('root')
        if (!root) return
        const panel = document.createElement('pre')
        panel.textContent = `앱을 시작하지 못했습니다.\n${message}`
        panel.style.cssText = 'box-sizing:border-box;min-height:100vh;margin:0;padding:32px;overflow:auto;background:#0a0e15;color:#ffb4b4;font:14px/1.6 monospace;white-space:pre-wrap'
        root.replaceChildren(panel)
      }
      window.addEventListener('error', (event) => {
        const target = event.target
        const source = target?.src || target?.href || target?.tagName || 'unknown resource'
        showStartupError(event.message || event.error?.stack || `리소스 로드 실패: ${source}`)
      }, true)
      window.addEventListener('unhandledrejection', (event) => showStartupError(event.reason?.stack || String(event.reason)))
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
